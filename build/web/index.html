<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a curated collection of art at the Online Art Gallery. Sign up as an artist or customer and discover stunning artworks.">
    <title>Online Art Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, sans-serif;
             background-image: url('images/orange.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #fff;
            font-size: 2.5rem;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.6);
        }

        .navbar {
            display: flex;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
        }

        .navbar a {
            color: #f2f2f2;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background-color: #f2f2f2;
            color: black;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .dropbtn:hover {
            background-color: #555;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 10px 16px;
            text-decoration: none;
            display: block;
            transition: background-color 0.3s ease;
        }

        .dropdown-content a:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .slideshow-container {
            max-width: 80%;
            margin: 40px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .mySlides {
            display: none;
        }

        .mySlides img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .dot-container {
            text-align: center;
            padding: 20px;
        }

        .dot {
            height: 15px;
            width: 15px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active {
            background-color: #717171;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #f2f2f2;
        }

        footer p {
            margin: 5px 0;
        }

        footer div a img {
            margin: 0 10px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <h2>Welcome to the Online Art Gallery</h2>

    <div class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Sign Up</button>
            <div class="dropdown-content">
                <a href="artistsignup.jsp">Artist</a>
                <a href="customerSignup.jsp">Customer</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Login</button>
            <div class="dropdown-content">
                <a href="artistlogin.jsp">Artist</a>
                <a href="customerlogin.jsp">Customer</a>
            </div>
        </div>
       
    </div>

    <div class="slideshow-container">
        <div class="mySlides fade">
            <img src="images/indeximage.jpg" alt="Abstract art in vivid colors">
        </div>

        <div class="mySlides fade">
            <img src="https://www.escapemotions.com/images/mainpage/images/blog_posts_bg/landing-page_blog_93303113643.jpg" alt="Modern digital painting with bright hues">
        </div>

        <div class="mySlides fade">
            <img src="images/indeximage3.jpg" alt="A serene landscape painting">
        </div>
    </div>

    <div class="dot-container">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <script>
        var slideIndex = 0;
        showSlides();

        function showSlides() {
            var i;
            var slides = document.getElementsByClassName("mySlides");
            var dots = document.getElementsByClassName("dot");
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";
            setTimeout(showSlides, 3000); // Change image every 3 seconds
        }
    </script>

    <footer>
        <p>&copy; 2024 Online Art Gallery. All rights reserved.</p>
        <p>Contact us: info@artgallery.com</p>
        <div>
            <a href="https://facebook.com"><img src="images/icons8-facebook-50.png" alt="Facebook" style="width:20px;"></a>
            <a href="https://instagram.com"><img src="images/icons8-instagram-48.png" alt="Instagram" style="width:20px;"></a>
        </div>
    </footer>
</body>

</html>
